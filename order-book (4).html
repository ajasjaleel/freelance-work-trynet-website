<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#0A0F3D" />
<title>Trynet — Order Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A0F3D;
    --red:#CC0000;
    --red-dark:#990000;
    --white:#FFFFFF;
    --off-white:#F8F8FC;
    --grey-200:#DDDDE8;
    --grey-600:#666680;
    --green:#22C55E;

    --paper:var(--off-white);
    --panel:var(--white);
    --ink:var(--navy);
    --ink-soft:var(--grey-600);
    --line:var(--grey-200);
    --line-soft:#ECEAF3;

    --font-display:'Bebas Neue', Impact, sans-serif;
    --font-serif:'Playfair Display', Georgia, serif;
    --font-body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  .app{display:flex;min-height:100vh;align-items:flex-start;}

  .sidebar{width:230px;flex:0 0 230px;background:var(--navy);color:#E7E7F2;display:flex;flex-direction:column;padding:28px 20px;position:sticky;top:0;align-self:flex-start;min-height:100vh;}
  .brand-mark{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:.03em;line-height:1;}
  .brand-try{color:#fff;}
  .brand-net{color:var(--red);}
  .brand-tag{margin-top:6px;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.14em;text-transform:uppercase;}
  .brand-sub{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);font-size:13px;color:rgba(255,255,255,.78);}

  .nav{margin-top:32px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;border-radius:4px;font-size:14.5px;color:#C7C7DA;transition:background .15s,color .15s;min-height:44px;display:flex;align-items:center;}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav-item.active{background:var(--red);color:#fff;font-weight:600;}
  .nav-item:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  .main{flex:1;padding:36px 44px;max-width:1080px;width:100%;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin-bottom:22px;}
  .toolbar-status{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-soft);}
  .toolbar-status .t-date{letter-spacing:.02em;}
  .toolbar-status .t-saved{letter-spacing:.02em;}
  .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .tbtn{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 14px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;justify-content:center;text-align:center;}
  .tbtn:hover{background:var(--line-soft);}
  .tbtn:disabled{opacity:.5;cursor:not-allowed;}
  .tbtn.danger{color:var(--red);border-color:rgba(204,0,0,.4);}
  .tbtn.danger:hover{background:rgba(204,0,0,.07);}
  .tbtn:focus-visible{outline:2px solid var(--red-dark);outline-offset:2px;}

  .recovery-banner,.error-banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-radius:6px;padding:14px 18px;margin-bottom:22px;color:var(--ink);}
  .recovery-banner{background:#FFF7ED;border:1px solid #F0A93B;}
  .error-banner{background:#FDECEC;border:1px solid var(--red);align-items:flex-start;flex-direction:column;}
  .recovery-banner .rb-text strong,.error-banner strong{display:block;font-size:14px;margin-bottom:2px;}
  .recovery-banner .rb-text span,.error-banner span{font-size:13px;color:var(--ink-soft);}
  .recovery-banner .rb-actions{display:flex;gap:8px;flex-shrink:0;}
  .error-banner .eb-foot{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .tab h1{font-family:var(--font-serif);font-size:26px;margin:0 0 4px;font-weight:700;color:var(--ink);}
  .tab .lead{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px;}
  .panel h2{font-family:var(--font-serif);font-size:17px;margin:0 0 14px;font-weight:700;color:var(--ink);}

  .grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .stat{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:var(--panel);min-width:0;}
  .stat .num{font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:.01em;word-break:break-word;}
  .stat .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .stat.green .num{color:var(--green);}
  .stat.amber .num{color:var(--red);}

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.ledger{width:100%;min-width:560px;border-collapse:collapse;font-size:14px;}
  table.ledger th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.ledger td{padding:10px;border-bottom:1px solid var(--line-soft);word-break:break-word;}
  table.ledger tr:last-child td{border-bottom:none;}
  .num-cell{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 11px;border:1px solid var(--line);border-radius:4px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
  .field input:disabled{background:var(--line-soft);color:var(--ink-soft);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red);}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  button.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--red);color:#fff;padding:12px 18px;border-radius:4px;font-size:14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
  button.btn:hover{background:var(--red-dark);}
  button.btn:disabled{opacity:.6;cursor:not-allowed;}
  button.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  button.btn.ghost:hover{background:var(--line-soft);}
  button.btn.small{padding:9px 14px;font-size:13px;min-height:38px;}
  button.btn:focus-visible{outline:2px solid var(--red-dark);outline-offset:2px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;border:1px solid;}
  .badge.due{color:var(--red);border-color:var(--red);background:rgba(204,0,0,.07);}
  .badge.settled{color:var(--green);border-color:var(--green);background:rgba(34,197,94,.08);}
  .badge.new{color:var(--navy);border-color:var(--navy);background:rgba(10,15,61,.05);}

  .empty{border:1px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--ink-soft);font-size:14px;}

  details.customer{border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:var(--panel);overflow:hidden;}
  details.customer summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  details.customer summary::-webkit-details-marker{display:none;}
  details.customer summary > div{min-width:0;word-break:break-word;}
  details.customer[open] summary{border-bottom:1px solid var(--line);}
  .cust-inner{padding:16px 18px;}

  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 18px;position:static;min-height:0;}
    .brand-tag,.brand-sub{display:none;}
    .nav{flex-direction:row;margin-top:0;margin-left:auto;overflow-x:auto;gap:4px;}
    .nav-item{padding:10px 12px;min-height:40px;}
    .main{padding:16px;}
    .grid-stats{grid-template-columns:repeat(2,1fr);}
    .row-2{grid-template-columns:1fr;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;}
  }
  @media (max-width:420px){
    .grid-stats{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div>
      <div class="brand-mark"><span class="brand-try">TRY</span><span class="brand-net">NET</span></div>
      <div class="brand-tag">Designing &amp; Printing</div>
      <div class="brand-sub">Order Book</div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="nav-item" data-tab="neworder" onclick="switchTab('neworder')">New order</button>
      <button class="nav-item" data-tab="customers" onclick="switchTab('customers')">Customers</button>
      <button class="nav-item" data-tab="transactions" onclick="switchTab('transactions')">Transactions</button>
    </nav>
  </aside>
  <main class="main">
    <div class="toolbar" role="toolbar" aria-label="Data actions">
      <div class="toolbar-status">
        <span class="t-date">Today: <span id="todayDate"></span></span>
        <span class="t-saved" id="savedStatus" aria-live="polite">No changes saved yet</span>
      </div>
      <div class="toolbar-actions">
        <button class="tbtn" type="button" id="btnBackup" title="Full backup file — can be restored later" onclick="downloadBackup()">⬇ Backup (.json)</button>
        <button class="tbtn" type="button" id="btnExportCsv" title="Spreadsheet report for Excel/Sheets — view only, cannot be restored" onclick="exportCSV()">⬇ Export (.csv)</button>
        <button class="tbtn" type="button" id="btnRestore" title="Restore data from a .json backup file" onclick="triggerRestore()">⬆ Restore</button>
        <button class="tbtn danger" type="button" id="btnReset" title="Permanently delete all data from this device" onclick="resetData()">Clear all data</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json,.json" style="display:none" onchange="handleRestoreFile(event)" />
    </div>
    <div id="errorBanner" aria-live="assertive"></div>
    <div id="recoveryBanner" aria-live="polite"></div>
    <section id="tab-dashboard" class="tab"></section>
    <section id="tab-neworder" class="tab" hidden></section>
    <section id="tab-customers" class="tab" hidden></section>
    <section id="tab-transactions" class="tab" hidden></section>
  </main>
</div>

<script>
'use strict';

// ---------- Globals ----------
let customers = [];
let orders = [];
let foundCustomer = null;
let newOrderMode = null;
let currentTab = 'dashboard';
let lastSavedAt = null;
let pendingRecovery = null;

const MAX_AMOUNT = 10000000;   // ₹1,00,00,000 sanity cap — blocks typos/Infinity, not a real business limit
const MAX_QTY = 100000;
const LOCAL_PREFIX = 'trynet-orderbook:';
const MIRROR_PREFIX = 'trynet-orderbook-mirror:';

// ---------- Formatting / money-safety helpers ----------
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// All money is rounded to the nearest paisa (2 decimals) the moment it is
// entered or read back, so floating-point noise (0.1+0.2 style errors)
// never accumulates across sums, saves, or reloads.
function roundMoney(n){
  const num = Number(n);
  if(!Number.isFinite(num)) return 0;
  return Math.round((num + Number.EPSILON) * 100) / 100;
}
function inr(n){
  const num = roundMoney(n);
  const hasPaise = Math.abs(num - Math.round(num)) > 0.001;
  return '₹' + num.toLocaleString('en-IN', hasPaise ? {minimumFractionDigits:2,maximumFractionDigits:2} : {maximumFractionDigits:0});
}
function formatDate(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
// Local calendar date (NOT UTC). Using toISOString() here would mis-date any
// order placed between midnight and ~5:30am IST to the previous day, since
// UTC is 5.5 hours behind India time — that would quietly corrupt "today's"
// totals and daily reconciliation for exactly the hours a shop might still
// be open late. This builds the date from local Y/M/D instead.
function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isToday(iso){ return iso === todayISO(); }
// Epsilon-based "is there really money owed" check, so tiny rounding dust
// (e.g. 0.0000000004 from repeated arithmetic) never shows as a false "Due".
function isDue(amount){ return amount > 0.005; }

// ---------- Phone handling ----------
// Normalizes to bare 10-digit form so "98765 43210", "+91 98765-43210" and
// "919876543210" are all recognised as the same customer.
function normalizePhone(raw){
  let digits = String(raw||'').replace(/\D/g,'');
  if(digits.length===12 && digits.startsWith('91')) digits = digits.slice(2);
  else if(digits.length===11 && digits.startsWith('0')) digits = digits.slice(1);
  return digits;
}
function isValidPhone(digits){ return /^\d{10}$/.test(digits); }

// ---------- ID generation ----------
// NOTE ON MULTI-DEVICE USE: IDs are the next unused number in-memory; there
// is no server-side atomic counter. refreshFromRemote() is called right
// before an ID is generated to shrink the collision window, but if two
// devices save in the exact same instant a duplicate ID is still
// theoretically possible. For one shop working from one or two devices at a
// time (not simultaneously typing an order on both at once) this risk is
// negligible. This is a deliberate simplicity trade-off, documented rather
// than hidden.
function nextId(prefix, arr, getId){
  let max = 0;
  arr.forEach(item=>{ const n = parseInt(String(getId(item)).split('-')[1],10); if(n>max) max=n; });
  return prefix + '-' + String(max+1).padStart(6,'0');
}
function nextCustomerId(){ return nextId('CUS', customers, c=>c.id); }
function nextOrderId(){ return nextId('ORD', orders, o=>o.id); }
function nextPaymentId(){
  let all = [];
  orders.forEach(o=> (o.payments||[]).forEach(p=> all.push(p)));
  return nextId('PMT', all, p=>p.id);
}

// ---------- Order math ----------
function orderPaid(o){ return roundMoney((o.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0)); }
function orderDue(o){ return roundMoney(Number(o.total||0) - orderPaid(o)); }

// ---------- Storage layer ----------
// Uses Claude's window.storage when available (inside a Claude artifact),
// otherwise falls back to the browser's own localStorage (standalone file /
// other host). Data is kept as two keys — "customers" and "orders" — rather
// than one key per record. That is simpler and easier to reason about for a
// single small business, at the cost of the multi-device ID-race noted
// above; a per-record-key design would remove that risk but adds real
// complexity (partial-write handling, listing/paging) that isn't justified
// for this app's scale.
//
// On top of the primary store, every save is also mirrored into a second,
// independent localStorage copy on this device. That mirror is NOT a
// substitute for "Backup (.json)" (it still lives in this one browser), but
// it means that if the primary store ever comes back empty — a sync hiccup,
// a cleared account, a fresh browser profile — the app can detect that and
// offer to recover from the mirror instead of silently starting blank.
function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
async function storageGet(key){
  if(hasClaudeStorage()){
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : null;
  }
  const v = localStorage.getItem(LOCAL_PREFIX+key);
  return v ? JSON.parse(v) : null;
}
async function storageSet(key, value){
  if(hasClaudeStorage()){
    await window.storage.set(key, JSON.stringify(value), false);
  } else {
    localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(value));
  }
  mirrorSet(key, value);
  touchSaved();
}
function mirrorGet(key){
  try{
    const v = localStorage.getItem(MIRROR_PREFIX+key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function mirrorSet(key, value){
  try{ localStorage.setItem(MIRROR_PREFIX+key, JSON.stringify(value)); }
  catch(e){ /* mirror is best-effort; never block a real save on it */ }
}
function touchSaved(){
  lastSavedAt = new Date();
  try{ localStorage.setItem(LOCAL_PREFIX+'lastSavedAt', lastSavedAt.toISOString()); }catch(e){}
  renderSavedStatus();
}
function renderSavedStatus(){
  const el = document.getElementById('savedStatus');
  if(!el) return;
  el.textContent = lastSavedAt
    ? 'Saved ' + lastSavedAt.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})
    : 'No changes saved yet';
}

async function loadAll(){
  try{ customers = await storageGet('customers') || []; }catch(e){ customers = []; }
  try{ orders = await storageGet('orders') || []; }catch(e){ orders = []; }
  if(!Array.isArray(customers)) customers = [];
  if(!Array.isArray(orders)) orders = [];

  if(customers.length===0 && orders.length===0){
    // Primary store looks empty — check whether the local mirror disagrees.
    const mCust = mirrorGet('customers') || [];
    const mOrd = mirrorGet('orders') || [];
    if(mCust.length>0 || mOrd.length>0){
      pendingRecovery = { customers: mCust, orders: mOrd };
      showRecoveryBanner();
    }
  } else {
    // Keep the mirror in sync with whatever we just loaded (self-heals the
    // mirror the first time this runs on existing data).
    mirrorSet('customers', customers);
    mirrorSet('orders', orders);
  }

  try{
    const savedStr = localStorage.getItem(LOCAL_PREFIX+'lastSavedAt');
    if(savedStr) lastSavedAt = new Date(savedStr);
  }catch(e){}
  renderSavedStatus();
}

async function saveCustomers(){
  try{ await storageSet('customers', customers); return true; }
  catch(e){ console.error(e); showFatalError('Could not save customer data (' + (e && e.message ? e.message : 'unknown error') + '). Nothing extra was lost — please try again.'); return false; }
}
async function saveOrders(){
  try{ await storageSet('orders', orders); return true; }
  catch(e){ console.error(e); showFatalError('Could not save order data (' + (e && e.message ? e.message : 'unknown error') + '). Nothing extra was lost — please try again.'); return false; }
}

// Deep-enough snapshot/restore pair used to roll back in-memory state if a
// save fails partway through, so the UI never shows data as "done" when it
// was not actually persisted.
function snapshotState(){
  return { customers: customers.slice(), orders: JSON.parse(JSON.stringify(orders)) };
}
function restoreState(snap){
  customers = snap.customers;
  orders = snap.orders;
}

// ---------- Busy-state helper (prevents double-submit / double-click) ----------
function setBusy(el, busy, label){
  if(!el) return;
  if(busy){
    if(el.dataset.origLabel===undefined) el.dataset.origLabel = el.textContent;
    if(label) el.textContent = label;
    el.disabled = true;
  } else {
    if(el.dataset.origLabel!==undefined){ el.textContent = el.dataset.origLabel; delete el.dataset.origLabel; }
    el.disabled = false;
  }
}

// ---------- Backup validation (trust boundary for restore / recovery) ----------
const ID_RE = { CUS:/^CUS-\d{6}$/, ORD:/^ORD-\d{6}$/, PMT:/^PMT-\d{6}$/ };
function isNonEmptyString(v, maxLen){ return typeof v==='string' && v.trim().length>0 && v.length<=maxLen; }
function isValidDateStr(v){
  if(typeof v!=='string' && !(v instanceof Date)) return false;
  const d = new Date(v);
  return !isNaN(d.getTime());
}
function isFiniteNonNegative(v){ return typeof v==='number' && Number.isFinite(v) && v>=0; }

// Strictly validates an untrusted {customers, orders} payload (a restored
// backup file, or the local recovery mirror) and rebuilds clean records
// field-by-field rather than trusting the object shape. This is what stops
// a corrupted or maliciously crafted "backup" file from injecting bad IDs,
// runaway numbers (Infinity/NaN), or script-bearing strings into the app.
// On any structural problem the whole file is rejected with no partial
// import — better to refuse a bad file than silently apply half of it.
function validateAndCleanBackup(data){
  if(!data || typeof data!=='object') return {ok:false, error:'File is not a valid backup (not an object).'};
  if(!Array.isArray(data.customers) || !Array.isArray(data.orders)){
    return {ok:false, error:'File is missing the customers/orders lists.'};
  }
  if(data.customers.length > 50000 || data.orders.length > 50000){
    return {ok:false, error:'File is too large to be a real backup from this app.'};
  }

  const cleanCustomers = [];
  const custIds = new Set();
  for(let i=0;i<data.customers.length;i++){
    const c = data.customers[i];
    if(!c || typeof c!=='object') return {ok:false, error:`Customer #${i+1} is malformed.`};
    if(typeof c.id!=='string' || !ID_RE.CUS.test(c.id)) return {ok:false, error:`Customer #${i+1} has an invalid ID.`};
    if(custIds.has(c.id)) return {ok:false, error:`Duplicate customer ID ${c.id} in file.`};
    if(!isNonEmptyString(c.name,200)) return {ok:false, error:`Customer ${c.id} has an invalid name.`};
    if(!isNonEmptyString(c.phone,30)) return {ok:false, error:`Customer ${c.id} has an invalid phone number.`};
    if(!isValidDateStr(c.createdAt)) return {ok:false, error:`Customer ${c.id} has an invalid created date.`};
    custIds.add(c.id);
    cleanCustomers.push({ id:c.id, name:String(c.name).trim().slice(0,200), phone:normalizePhone(c.phone), createdAt:String(c.createdAt) });
  }

  const cleanOrders = [];
  const orderIds = new Set();
  const allPmtIds = new Set();
  for(let i=0;i<data.orders.length;i++){
    const o = data.orders[i];
    if(!o || typeof o!=='object') return {ok:false, error:`Order #${i+1} is malformed.`};
    if(typeof o.id!=='string' || !ID_RE.ORD.test(o.id)) return {ok:false, error:`Order #${i+1} has an invalid ID.`};
    if(orderIds.has(o.id)) return {ok:false, error:`Duplicate order ID ${o.id} in file.`};
    if(!custIds.has(o.customerId)) return {ok:false, error:`Order ${o.id} refers to a customer that is not in the file.`};
    if(!isNonEmptyString(o.service,200)) return {ok:false, error:`Order ${o.id} has an invalid service name.`};
    if(typeof o.description!=='string' || o.description.length>2000) return {ok:false, error:`Order ${o.id} has an invalid description.`};
    if(!Number.isFinite(o.qty) || !Number.isInteger(o.qty) || o.qty<1 || o.qty>MAX_QTY) return {ok:false, error:`Order ${o.id} has an invalid quantity.`};
    if(!isFiniteNonNegative(o.total) || o.total>MAX_AMOUNT) return {ok:false, error:`Order ${o.id} has an invalid total amount.`};
    if(!isValidDateStr(o.date)) return {ok:false, error:`Order ${o.id} has an invalid date.`};
    if(!Array.isArray(o.payments)) return {ok:false, error:`Order ${o.id} has invalid payment records.`};

    const cleanPayments = [];
    for(let j=0;j<o.payments.length;j++){
      const p = o.payments[j];
      if(!p || typeof p!=='object') return {ok:false, error:`A payment on order ${o.id} is malformed.`};
      if(typeof p.id!=='string' || !ID_RE.PMT.test(p.id)) return {ok:false, error:`A payment on order ${o.id} has an invalid ID.`};
      if(allPmtIds.has(p.id)) return {ok:false, error:`Duplicate payment ID ${p.id} in file.`};
      if(!isFiniteNonNegative(p.amount) || p.amount>MAX_AMOUNT) return {ok:false, error:`A payment on order ${o.id} has an invalid amount.`};
      if(!isNonEmptyString(p.method,50)) return {ok:false, error:`A payment on order ${o.id} has an invalid method.`};
      if(!isValidDateStr(p.date)) return {ok:false, error:`A payment on order ${o.id} has an invalid date.`};
      allPmtIds.add(p.id);
      cleanPayments.push({ id:p.id, amount:roundMoney(p.amount), method:String(p.method).trim().slice(0,50), date:String(p.date) });
    }
    orderIds.add(o.id);
    cleanOrders.push({
      id:o.id, customerId:o.customerId, service:String(o.service).trim().slice(0,200),
      description:String(o.description||'').trim().slice(0,2000), qty:o.qty, total:roundMoney(o.total),
      date:String(o.date), payments:cleanPayments
    });
  }

  return {ok:true, customers:cleanCustomers, orders:cleanOrders};
}

// ---------- Backup (.json) / Export (.csv) / Restore ----------
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function downloadBackup(){
  try{
    const payload = { app:'trynet-orderbook', exportedAt: new Date().toISOString(), customers, orders };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    triggerDownload(blob, 'trynet-orderbook-backup-' + todayISO() + '.json');
  }catch(e){
    console.error(e);
    alert('Could not create the backup file. Please try again.');
  }
}

// Standard CSV-injection mitigation (OWASP): a cell that would open with
// =, +, -, @, a tab, or a carriage return gets a leading apostrophe so
// spreadsheet apps treat it as inert text instead of a formula. This
// matters because customer/service names are free text a person can type
// anything into, and this file is opened by a real spreadsheet app.
const FORMULA_INJECTION_RE = /^[=+\-@\t\r]/;
function csvCell(value){
  let s = (value===null || value===undefined) ? '' : String(value);
  if(FORMULA_INJECTION_RE.test(s)) s = "'" + s;
  if(/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function csvRow(cells){ return cells.map(csvCell).join(','); }

function exportCSV(){
  try{
    const rows = [];
    const add = (...cells)=> rows.push(csvRow(cells));

    add('Trynet — Order Book Export');
    add('Exported at', new Date().toLocaleString('en-IN'));
    rows.push('');

    add('ORDERS');
    add('Order ID','Date','Customer Name','Phone','Service','Description','Quantity','Total (INR)','Paid (INR)','Due (INR)','Status');
    orders.slice().sort((a,b)=> a.id.localeCompare(b.id)).forEach(o=>{
      const c = customers.find(cc=>cc.id===o.customerId);
      const paid = orderPaid(o), due = orderDue(o);
      add(o.id, formatDate(o.date), c?c.name:'—', c?c.phone:'—', o.service, o.description||'', o.qty,
        roundMoney(o.total).toFixed(2), paid.toFixed(2), due.toFixed(2), isDue(due)?'Due':'Settled');
    });
    rows.push('');

    add('PAYMENTS');
    add('Payment ID','Date','Order ID','Customer Name','Service','Method','Amount (INR)');
    let allPayments = [];
    orders.forEach(o=>{
      const c = customers.find(cc=>cc.id===o.customerId);
      (o.payments||[]).forEach(p=> allPayments.push({...p, orderId:o.id, service:o.service, customerName:c?c.name:'—'}));
    });
    allPayments.sort((a,b)=> a.id.localeCompare(b.id));
    allPayments.forEach(p=> add(p.id, formatDate(p.date), p.orderId, p.customerName, p.service, p.method, roundMoney(p.amount).toFixed(2)));
    rows.push('');

    add('SUMMARY');
    const totalBilled = roundMoney(orders.reduce((s,o)=>s+Number(o.total||0),0));
    const totalPaid = roundMoney(allPayments.reduce((s,p)=>s+Number(p.amount||0),0));
    add('Total orders', orders.length);
    add('Total customers', customers.length);
    add('Total billed (INR)', totalBilled.toFixed(2));
    add('Total received (INR)', totalPaid.toFixed(2));
    add('Total outstanding (INR)', roundMoney(totalBilled-totalPaid).toFixed(2));

    // Leading BOM ensures Excel opens the file as UTF-8 (so ₹ and Indian
    // names render correctly instead of as garbled characters). CRLF line
    // endings match what Excel expects from a CSV file.
    const csvContent = '\uFEFF' + rows.join('\r\n');
    const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
    triggerDownload(blob, 'trynet-orderbook-export-' + todayISO() + '.csv');
  }catch(e){
    console.error(e);
    alert('Could not create the export file. Please try again.');
  }
}

function triggerRestore(){
  document.getElementById('restoreFile').click();
}

async function handleRestoreFile(evt){
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  if(file.size > 20*1024*1024){ alert('That file is too large to be a backup from this app.'); return; }

  const restoreBtn = document.getElementById('btnRestore');
  setBusy(restoreBtn, true, 'Restoring…');
  try{
    let data;
    try{
      const text = await file.text();
      data = JSON.parse(text);
    }catch(e){
      alert('Could not read that file. Make sure it is a .json backup exported from this app (not the .csv export, which cannot be restored).');
      return;
    }

    const result = validateAndCleanBackup(data);
    if(!result.ok){
      alert('This file could not be restored:\n\n' + result.error + '\n\nNo changes were made to your current data.');
      return;
    }

    const when = (data.exportedAt && isValidDateStr(data.exportedAt)) ? formatDate(data.exportedAt) : 'an unknown date';
    const msg = `This will REPLACE all current data with the backup from ${when} (${result.customers.length} customers, ${result.orders.length} orders).\n\nThis cannot be undone. Continue?`;
    if(!confirm(msg)) return;

    const snap = snapshotState();
    customers = result.customers;
    orders = result.orders;
    const ok1 = await saveCustomers();
    const ok2 = ok1 && await saveOrders();
    if(!ok1 || !ok2){
      restoreState(snap);
      alert('Restore failed while saving. Your previous data has been kept.');
      return;
    }
    dismissRecovery();
    switchTab('dashboard');
    alert('Backup restored — ' + result.customers.length + ' customers, ' + result.orders.length + ' orders.');
  } finally {
    setBusy(restoreBtn, false);
  }
}

// ---------- Reset ----------
async function resetData(){
  if(customers.length===0 && orders.length===0){ alert('There is no data to clear.'); return; }
  if(!confirm('This permanently deletes every customer, order and payment saved here.\n\nIt is strongly recommended you click "Backup (.json)" first.\n\nContinue to the final confirmation?')) return;
  const typed = prompt('Type DELETE (capital letters) to permanently erase all data:');
  if(typed !== 'DELETE'){ alert('Nothing was deleted.'); return; }

  const resetBtn = document.getElementById('btnReset');
  setBusy(resetBtn, true, 'Clearing…');
  try{
    const snap = snapshotState();
    customers = []; orders = [];
    const ok1 = await saveCustomers();
    const ok2 = ok1 && await saveOrders();
    if(!ok1 || !ok2){
      restoreState(snap);
      alert('Could not clear data — nothing was deleted. Please try again.');
      return;
    }
    dismissRecovery();
    switchTab('dashboard');
  } finally {
    setBusy(resetBtn, false);
  }
}

// ---------- Recovery banner (local mirror) ----------
function showRecoveryBanner(){
  const el = document.getElementById('recoveryBanner');
  if(!el || !pendingRecovery) return;
  el.innerHTML = `
    <div class="recovery-banner">
      <div class="rb-text">
        <strong>Your saved data looks empty, but a local copy was found on this device</strong>
        <span>This can happen after a sync issue or a cleared session. Recover ${pendingRecovery.customers.length} customer(s) and ${pendingRecovery.orders.length} order(s) from that local copy?</span>
      </div>
      <div class="rb-actions">
        <button class="btn small" type="button" onclick="applyRecovery()">Recover data</button>
        <button class="btn small ghost" type="button" onclick="dismissRecovery()">Dismiss</button>
      </div>
    </div>`;
}
async function applyRecovery(){
  if(!pendingRecovery) return;
  const result = validateAndCleanBackup(pendingRecovery);
  if(!result.ok){
    alert('The local copy could not be recovered safely (' + result.error + ').');
    dismissRecovery();
    return;
  }
  const snap = snapshotState();
  customers = result.customers;
  orders = result.orders;
  const ok1 = await saveCustomers();
  const ok2 = ok1 && await saveOrders();
  if(!ok1 || !ok2){
    restoreState(snap);
    alert('Recovery failed while saving. Please try again.');
    return;
  }
  dismissRecovery();
  switchTab('dashboard');
}
function dismissRecovery(){
  pendingRecovery = null;
  const el = document.getElementById('recoveryBanner');
  if(el) el.innerHTML = '';
}

// ---------- Global error handling ----------
// A silent crash in a money app is unacceptable — the person would have no
// way to tell whether their last action actually saved. Any uncaught error
// or rejected promise surfaces here instead of leaving a blank/frozen page.
function showFatalError(msg){
  const el = document.getElementById('errorBanner');
  if(!el) return;
  el.innerHTML = `
    <div class="error-banner" role="alert">
      <strong>Something went wrong</strong>
      <span>${esc(msg || 'Unknown error')}</span>
      <span class="eb-foot">This does not affect data you already saved. If a specific save just failed, you would have seen a separate message for that.</span>
      <button class="tbtn" type="button" style="margin-top:6px;" onclick="document.getElementById('errorBanner').innerHTML=''">Dismiss</button>
    </div>`;
}
window.addEventListener('error', function(ev){
  console.error('Uncaught error:', ev.error || ev.message);
  showFatalError(ev.message || 'An unexpected error occurred.');
});
window.addEventListener('unhandledrejection', function(ev){
  console.error('Unhandled rejection:', ev.reason);
  showFatalError((ev.reason && ev.reason.message) ? ev.reason.message : 'An unexpected error occurred.');
});

// ---------- Background multi-tab / multi-device sync ----------
// Purely additive: records that exist remotely but not locally are pulled
// in; records that already exist locally (which, by construction, were
// already saved a moment ago) are kept as-is. For orders present on both
// sides, payment lists are unioned by payment ID so a payment added from a
// second tab/device isn't lost. This never overwrites unsaved form input —
// the "New order" tab is deliberately skipped for re-rendering.
function mergeCustomers(local, remote){
  const map = new Map();
  remote.forEach(c=> map.set(c.id, c));
  local.forEach(c=> map.set(c.id, c));
  return Array.from(map.values());
}
function mergePayments(localPayments, remotePayments){
  const map = new Map();
  (remotePayments||[]).forEach(p=> map.set(p.id, p));
  (localPayments||[]).forEach(p=> map.set(p.id, p));
  return Array.from(map.values());
}
function mergeOrders(local, remote){
  const remoteMap = new Map(remote.map(o=>[o.id,o]));
  const map = new Map();
  remote.forEach(o=> map.set(o.id, o));
  local.forEach(o=> map.set(o.id, o));
  map.forEach((order, id)=>{
    const ro = remoteMap.get(id);
    if(ro && ro !== order){
      order.payments = mergePayments(order.payments, ro.payments);
    }
  });
  return Array.from(map.values());
}
async function refreshFromRemote(){
  if(!hasClaudeStorage()) return; // nothing remote beyond this browser to merge in
  try{
    let remoteCustomers = null, remoteOrders = null;
    try{ remoteCustomers = await storageGet('customers'); }catch(e){ /* not found / transient — skip */ }
    try{ remoteOrders = await storageGet('orders'); }catch(e){ /* not found / transient — skip */ }

    let changed = false;
    if(Array.isArray(remoteCustomers)){
      const before = customers.length;
      customers = mergeCustomers(customers, remoteCustomers);
      if(customers.length !== before) changed = true;
    }
    if(Array.isArray(remoteOrders)){
      const beforeIds = orders.map(o=>o.id).join(',');
      orders = mergeOrders(orders, remoteOrders);
      if(orders.map(o=>o.id).join(',') !== beforeIds) changed = true;
    }
    if(changed){
      mirrorSet('customers', customers);
      mirrorSet('orders', orders);
      if(currentTab && currentTab!=='neworder') renderTabSafely(currentTab);
    }
  }catch(e){
    console.warn('Background sync skipped:', e);
  }
}

// ---------- Tabs ----------
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab').forEach(s=> s.hidden = (s.id !== 'tab-'+tab));
  renderTabSafely(tab);
}
function renderTabSafely(tab){
  try{
    if(tab==='dashboard') renderDashboard();
    else if(tab==='neworder') renderNewOrder();
    else if(tab==='customers') renderCustomers();
    else if(tab==='transactions') renderTransactions();
  }catch(e){
    console.error(e);
    showFatalError('There was a problem showing this screen (' + (e && e.message ? e.message : 'unknown error') + '). Your saved data is safe — try switching tabs again or reload the page.');
  }
}

// ---------- Dashboard ----------
function renderDashboard(){
  const el = document.getElementById('tab-dashboard');
  const todaysOrders = orders.filter(o=>isToday(o.date));
  const salesToday = roundMoney(todaysOrders.reduce((s,o)=>s+Number(o.total||0),0));
  let receivedToday = 0;
  orders.forEach(o=> (o.payments||[]).forEach(p=>{ if(isToday(p.date)) receivedToday += Number(p.amount||0); }));
  receivedToday = roundMoney(receivedToday);
  const totalOutstanding = roundMoney(orders.reduce((s,o)=> s + Math.max(orderDue(o),0), 0));

  let allPayments = [];
  orders.forEach(o=>{
    const cust = customers.find(c=>c.id===o.customerId);
    (o.payments||[]).forEach(p=> allPayments.push({...p, orderService:o.service, customerName: cust? cust.name : '—'}));
  });
  allPayments.sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
  const recent = allPayments.slice(0,6);

  el.innerHTML = `
    <h1>Dashboard</h1>
    <p class="lead">Today's summary and outstanding balances.</p>
    <div class="grid-stats">
      <div class="stat"><div class="num">${todaysOrders.length}</div><div class="label">Orders today</div></div>
      <div class="stat"><div class="num">${inr(salesToday)}</div><div class="label">Sales today</div></div>
      <div class="stat green"><div class="num">${inr(receivedToday)}</div><div class="label">Received today</div></div>
      <div class="stat amber"><div class="num">${inr(totalOutstanding)}</div><div class="label">Total outstanding</div></div>
    </div>
    <div class="panel">
      <h2>Recent payments</h2>
      ${recent.length ? `
      <div class="table-wrap">
      <table class="ledger">
        <thead><tr><th>Date</th><th>Customer</th><th>For</th><th>Method</th><th style="text-align:right">Amount</th></tr></thead>
        <tbody>
          ${recent.map(p=>`<tr><td>${formatDate(p.date)}</td><td>${esc(p.customerName)}</td><td>${esc(p.orderService)}</td><td>${esc(p.method)}</td><td class="num-cell">${inr(p.amount)}</td></tr>`).join('')}
        </tbody>
      </table>
      </div>` : `<div class="empty">No payments recorded yet. Create an order to get started.</div>`}
    </div>
  `;
}

function lookupCustomer(){
  const raw = document.getElementById('no-phone').value.trim();
  const phone = normalizePhone(raw);
  const statusEl = document.getElementById('cust-status');
  const nameInput = document.getElementById('no-name');
  if(!isValidPhone(phone)){
    statusEl.innerHTML = `<p style="color:var(--red);font-size:13px;margin:10px 0 0;">Enter a valid 10-digit phone number.</p>`;
    foundCustomer = null; newOrderMode = null;
    return;
  }
  const c = customers.find(c=>c.phone===phone);
  if(c){
    foundCustomer = c; newOrderMode = 'existing';
    nameInput.value = c.name; nameInput.disabled = true;
    statusEl.innerHTML = `<p style="margin:12px 0 0;"><span class="badge settled">Existing customer</span> <span style="color:var(--ink-soft);font-size:12.5px;letter-spacing:.02em;">${esc(c.id)}</span></p>`;
  } else {
    foundCustomer = null; newOrderMode = 'new';
    nameInput.value = ''; nameInput.disabled = false; nameInput.focus();
    statusEl.innerHTML = `<p style="margin:12px 0 0;"><span class="badge new">New customer</span> enter their name below</p>`;
  }
}

function updateRemaining(){
  const total = roundMoney(document.getElementById('no-total').value);
  const paid = roundMoney(document.getElementById('no-paid').value);
  const remaining = roundMoney(Math.max(total-paid,0));
  const rEl = document.getElementById('no-remaining');
  rEl.textContent = inr(remaining);
  rEl.style.color = isDue(remaining) ? 'var(--red)' : 'var(--green)';
}

async function submitOrder(e){
  e.preventDefault();
  const submitBtn = document.getElementById('order-submit-btn');
  const msgEl = document.getElementById('save-msg');
  msgEl.textContent = '';

  const phone = normalizePhone(document.getElementById('no-phone').value);
  const name = document.getElementById('no-name').value.trim();
  const service = document.getElementById('no-service').value.trim();
  const qty = Number(document.getElementById('no-qty').value);
  const desc = document.getElementById('no-desc').value.trim();
  const total = roundMoney(document.getElementById('no-total').value);
  const paid = roundMoney(document.getElementById('no-paid').value || 0);
  const method = document.getElementById('no-method').value;

  if(!isValidPhone(phone)){ alert('Enter a valid 10-digit phone number.'); return false; }
  if(newOrderMode===null){ alert('Click "Check number" first.'); return false; }
  if(newOrderMode==='new' && !name){ alert('Enter the customer name.'); return false; }
  if(name.length>200){ alert('Customer name is too long.'); return false; }
  if(!service){ alert('Enter the service.'); return false; }
  if(service.length>200){ alert('Service name is too long.'); return false; }
  if(desc.length>2000){ alert('Description is too long.'); return false; }
  if(!Number.isFinite(qty) || !Number.isInteger(qty) || qty<1 || qty>MAX_QTY){ alert('Enter a valid whole-number quantity (1–' + MAX_QTY.toLocaleString('en-IN') + ').'); return false; }
  if(!Number.isFinite(total) || total<=0 || total>MAX_AMOUNT){ alert('Enter a valid total amount between ₹1 and ₹' + MAX_AMOUNT.toLocaleString('en-IN') + '.'); return false; }
  if(!Number.isFinite(paid) || paid<0 || paid>MAX_AMOUNT){ alert('Enter a valid paid amount.'); return false; }
  if(paid>total){ alert('Paid amount cannot be more than the total.'); return false; }

  setBusy(submitBtn, true, 'Saving…');
  try{
    // Refresh first — shrinks (does not eliminate) the window in which
    // another device could create a same-phone customer or a colliding ID.
    await refreshFromRemote();

    const snap = snapshotState();

    // Re-check for an existing customer at submit time (not just at "Check
    // number" time) so two near-simultaneous new orders for the same new
    // phone number don't create two separate customer records.
    let customer = customers.find(c=>c.phone===phone);
    if(!customer){
      if(!name){ alert('Enter the customer name.'); return false; }
      customer = { id: nextCustomerId(), name, phone, createdAt: todayISO() };
      customers.push(customer);
      const ok = await saveCustomers();
      if(!ok){ restoreState(snap); alert('Could not save the new customer. Nothing was changed — please try again.'); return false; }
    }

    const order = {
      id: nextOrderId(), customerId: customer.id, service, description: desc, qty, total, date: todayISO(),
      payments: paid>0 ? [{ id: nextPaymentId(), amount: paid, method, date: todayISO() }] : []
    };
    orders.push(order);
    const ok2 = await saveOrders();
    if(!ok2){
      // Roll back the order only; the customer (if newly created) is
      // harmless left in place — an extremely rare edge case not worth the
      // complexity of also un-creating it.
      orders = snap.orders;
      alert('The order could not be saved. Please try again.');
      return false;
    }

    msgEl.textContent = `Saved — order ${order.id}`;
    setTimeout(()=>{ renderNewOrder(); document.getElementById('no-phone').focus(); }, 700);
    return false;
  } finally {
    setBusy(submitBtn, false);
  }
}

// ---------- Customers ----------
function renderCustomers(){
  const el = document.getElementById('tab-customers');
  el.innerHTML = `
    <h1>Customers</h1>
    <p class="lead">Search by name or phone. Open a customer to see their order history and add payments.</p>
    <div class="field" style="max-width:320px;">
      <input id="cust-search" type="text" placeholder="Search name or phone" oninput="renderCustomerList()" />
    </div>
    <div id="cust-list"></div>
  `;
  renderCustomerList();
}

function renderCustomerList(){
  const listEl = document.getElementById('cust-list');
  const qRaw = (document.getElementById('cust-search')?.value||'').trim().toLowerCase();
  const qDigits = qRaw.replace(/\D/g,'');
  let list = customers.filter(c=> !qRaw || c.name.toLowerCase().includes(qRaw) || (qDigits && c.phone.includes(qDigits)));
  list = list.slice().sort((a,b)=> b.id.localeCompare(a.id));

  if(!list.length){
    listEl.innerHTML = `<div class="empty">${customers.length? 'No customers match that search.' : 'No customers yet. Add one from New order.'}</div>`;
    return;
  }

  listEl.innerHTML = list.map(c=>{
    const os = orders.filter(o=>o.customerId===c.id).sort((a,b)=> b.id.localeCompare(a.id));
    const billed = roundMoney(os.reduce((s,o)=>s+Number(o.total||0),0));
    const paid = roundMoney(os.reduce((s,o)=>s+orderPaid(o),0));
    const due = roundMoney(billed-paid);
    return `
    <details class="customer">
      <summary>
        <div>
          <div style="font-weight:600;">${esc(c.name)}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);letter-spacing:.02em;">${esc(c.id)} · ${esc(c.phone)}</div>
        </div>
        <div style="text-align:right;">
          <div class="num-cell" style="font-size:15px;">${inr(due)}</div>
          <span class="badge ${isDue(due)?'due':'settled'}">${isDue(due)?'Due':'Settled'}</span>
        </div>
      </summary>
      <div class="cust-inner">
        <div style="display:flex;gap:24px;margin-bottom:14px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;">
          <span>Total billed <b style="color:var(--ink);">${inr(billed)}</b></span>
          <span>Total paid <b style="color:var(--ink);">${inr(paid)}</b></span>
        </div>
        ${os.length ? os.map(o=>renderOrderRow(o)).join('') : `<div class="empty">No orders yet.</div>`}
      </div>
    </details>`;
  }).join('');

  wirePaymentButtons(listEl);
}

function renderOrderRow(o){
  const paid = orderPaid(o);
  const due = orderDue(o);
  return `
  <div style="border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div style="min-width:0;">
        <div style="font-weight:600;font-size:14px;word-break:break-word;">${esc(o.service)}</div>
        <div style="font-size:12.5px;color:var(--ink-soft);word-break:break-word;">${esc(o.id)} · ${formatDate(o.date)}${o.description? ' · '+esc(o.description) : ''}</div>
      </div>
      <div style="text-align:right;font-size:13px;">
        <div>total <b class="num-cell" style="display:inline;">${inr(o.total)}</b></div>
        <div>paid <b class="num-cell" style="display:inline;color:var(--green);">${inr(paid)}</b></div>
        <div>due <b class="num-cell" style="display:inline;color:${isDue(due)?'var(--red)':'var(--green)'};">${inr(due)}</b></div>
      </div>
    </div>
    ${isDue(due) ? `
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <input type="number" inputmode="numeric" min="1" step="1" max="${due}" placeholder="Amount" id="pay-amt-${esc(o.id)}" style="width:120px;padding:9px 9px;border:1px solid var(--line);border-radius:4px;font-size:16px;" />
      <select id="pay-method-${esc(o.id)}" style="padding:9px 9px;border:1px solid var(--line);border-radius:4px;font-size:16px;">
        <option>Cash</option><option>UPI</option><option>Card</option><option>Other</option>
      </select>
      <button class="btn small" type="button" data-action="pay" data-order-id="${esc(o.id)}">Record payment</button>
    </div>` : ''}
  </div>`;
}

// Delegated listeners (rather than inline onclick with an interpolated ID)
// so a corrupted/odd order ID can never break out of a JS string literal —
// the ID only ever reaches JS via .dataset, never via re-parsed markup.
function wirePaymentButtons(container){
  container.querySelectorAll('button[data-action="pay"]').forEach(btn=>{
    btn.addEventListener('click', function(){ addPayment(btn.dataset.orderId, btn); });
  });
}

async function addPayment(orderId, btnEl){
  const amtEl = document.getElementById('pay-amt-'+orderId);
  const methodEl = document.getElementById('pay-method-'+orderId);
  if(!amtEl || !methodEl) return;
  const amt = roundMoney(amtEl.value);
  if(!Number.isFinite(amt) || amt<=0 || amt>MAX_AMOUNT){ alert('Enter a valid amount greater than zero.'); return; }

  setBusy(btnEl, true, 'Saving…');
  try{
    await refreshFromRemote();
    const order = orders.find(o=>o.id===orderId);
    if(!order){ alert('This order could not be found — it may have changed elsewhere. Refreshing the list.'); renderCustomerList(); return; }
    const due = orderDue(order);
    if(amt > due + 0.005){ alert('Amount cannot be more than the balance due (' + inr(due) + ').'); return; }

    const snap = snapshotState();
    order.payments.push({ id: nextPaymentId(), amount: amt, method: methodEl.value, date: todayISO() });
    const ok = await saveOrders();
    if(!ok){ restoreState(snap); alert('Could not save the payment. Please try again.'); return; }
    renderCustomerList();
  } finally {
    setBusy(btnEl, false);
  }
}

// ---------- Transactions ----------
function renderTransactions(){
  const el = document.getElementById('tab-transactions');
  let list = [];
  orders.forEach(o=>{
    const c = customers.find(c=>c.id===o.customerId);
    (o.payments||[]).forEach(p=> list.push({...p, customerName: c? c.name : '—', service:o.service, orderId:o.id}));
  });
  list.sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
  const total = roundMoney(list.reduce((s,p)=>s+Number(p.amount||0),0));

  el.innerHTML = `
    <h1>Transactions</h1>
    <p class="lead">Every payment received, most recent first.</p>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <span style="font-size:13px;color:var(--ink-soft);">${list.length} payment${list.length===1?'':'s'} recorded</span>
        <span style="font-family:var(--font-display);font-size:24px;color:var(--navy);">${inr(total)}</span>
      </div>
      ${list.length ? `
      <div class="table-wrap">
      <table class="ledger">
        <thead><tr><th>Date</th><th>Customer</th><th>Order</th><th>Method</th><th style="text-align:right">Amount</th></tr></thead>
        <tbody>
          ${list.map(p=>`<tr><td>${formatDate(p.date)}</td><td>${esc(p.customerName)}</td><td>${esc(p.service)} <span style="color:var(--ink-soft);font-size:12px;">(${esc(p.orderId)})</span></td><td>${esc(p.method)}</td><td class="num-cell">${inr(p.amount)}</td></tr>`).join('')}
        </tbody>
      </table>
      </div>` : `<div class="empty">No transactions yet.</div>`}
    </div>
  `;
}

// ---------- Init ----------
async function init(){
  try{
    document.getElementById('todayDate').textContent = formatDate(new Date());
    await loadAll();
    switchTab('dashboard');
    setInterval(()=>{ if(!document.hidden) refreshFromRemote(); }, 30000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshFromRemote(); });
  }catch(e){
    console.error(e);
    showFatalError('The app failed to start properly (' + (e && e.message ? e.message : 'unknown error') + '). Try reloading the page.');
  }
}
init();
</script>
